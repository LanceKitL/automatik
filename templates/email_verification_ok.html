<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verification Success</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      height: 95vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f8f8;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: inset 0 .2px 2.0px rgba(0, 0, 0, 0.01);
      box-shadow: 0 .2px 2.0px rgba(0, 0, 0, 0.01);
      max-width: 400px;
      width: 90%;
    }

    .checkmark {
      width: 80px;
      height: 80px;
      background: #22c55e;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      margin: 0 auto 20px;
    }

    h3 {
      color: #111827;
      margin-bottom: 10px;
    }

    p {
      color: #6b7280;
      font-size: 1.5vw;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: black;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s ease-in-out;
    }

    .btn:hover {
      transform: scale(1.03) ;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="checkmark">✓</div>

    <h3>Email Verified!</h3>

    <p>
      Your email address has been successfully verified.
      You can now continue using your account.
    </p>

    <a href="/" class="btn">Login</a>
  </div>

</body>
</html>
