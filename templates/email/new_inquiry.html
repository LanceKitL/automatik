{% extends "email/_base.html" %}
{% block content %}
<tr><td class="body">
  <h2>New Customer Inquiry</h2>
  <p>A customer has submitted a new inquiry through the portal.</p>
  <table class="details" cellpadding="0" cellspacing="0">
    <tr><td class="lbl">Customer ID</td><td class="val">{{ customer_id }}</td></tr>
    <tr><td class="lbl">Vehicle</td><td class="val">{{ vehicle_name }}</td></tr>
  </table>
  <div class="info-box"><strong>Message:</strong><br>{{ message }}</div>
  <div class="btn-wrap"><a class="btn" href="{{ inquiry_url }}">View Inquiry</a></div>
</td></tr>
{% endblock %}
