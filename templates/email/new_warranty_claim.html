{% extends "email/_base.html" %}
{% block content %}
<tr><td class="body">
  <h2>New Warranty Claim</h2>
  <p>A customer has submitted a new warranty claim through the portal.</p>
  <table class="details" cellpadding="0" cellspacing="0">
    <tr><td class="lbl">Customer ID</td><td class="val">{{ customer_id }}</td></tr>
    <tr><td class="lbl">Claim Type</td><td class="val">{{ claim_type | capitalize }}</td></tr>
    <tr><td class="lbl">Vehicle</td><td class="val">{{ vehicle_name }}</td></tr>
  </table>
  <div class="info-box"><strong>Description:</strong><br>{{ description }}</div>
  <div class="btn-wrap"><a class="btn" href="{{ claim_url }}">View Claim</a></div>
</td></tr>
{% endblock %}
