<!DOCTYPE html>
<!-- TEMPORARY: Remove this file and the GET /login route after testing -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Socket Test</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 320px; }
        h1 { font-size: 1.5rem; margin-top: 0; }
        label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; margin-top: 1rem; padding: 0.6rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        #error { color: #dc2626; margin-top: 0.75rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Login (Socket Test)</h1>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" value="admin" required>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" value="admin123" required>
            <button type="submit">Login</button>
        </form>
        <div id="error"></div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errEl = document.getElementById('error');
        errEl.textContent = '';

        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });

        const data = await res.json();

        if (res.ok) {
            // Login success — cookie is set, redirect to test page
            window.location.href = '/notification/test';
        } else {
            errEl.textContent = data.message || 'Login failed';
        }
    });
    </script>
</body>
</html>
